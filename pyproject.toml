[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sliding-window-rate-limiter"
version = "0.1.0"
description = "Sliding-window rate limiter per API key for an LLM gateway — FastAPI + Redis + Lua"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fakeredis[lua]>=2.26",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F — pycodestyle + pyflakes, I — сортировка импортов, UP — современный синтаксис,
# B — частые ошибки (bugbear), ASYNC — ошибки в асинхронном коде.
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI использует вызовы в значениях по умолчанию (Depends, Header) — это нормально.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Body"]
